name: Deploy to cyon (rsync über SSH)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-Run: nur anzeigen, was passieren würde"
        type: boolean
        default: true

# Nur ein Deployment gleichzeitig
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Code auschecken
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 2. Sicherheitscheck: config.php darf nicht im Repo sein
      - name: Verify config.php is not committed
        run: |
          if [ -f "config/config.php" ]; then
            echo "::error::config.php wurde versehentlich committet! Deployment abgebrochen."
            exit 1
          fi
          echo "config.php-Check OK."

      # 3. config.php aus GitHub Secrets generieren
      # var_export() escaped Sonderzeichen im Passwort korrekt
      - name: Generate config.php from secrets
        env:
          DB_HOST:        ${{ secrets.DB_HOST }}
          DB_NAME:        ${{ secrets.DB_NAME }}
          DB_USER:        ${{ secrets.DB_USER }}
          DB_PASS:        ${{ secrets.DB_PASS }}
          APP_BASE_URL:   ${{ secrets.APP_BASE_URL }}
          AUTH_USER:      ${{ secrets.AUTH_USER }}
          AUTH_PASS_HASH: ${{ secrets.AUTH_PASS_HASH }}
        run: |
          php -r "
            \$d = function(string \$k, string \$env): string {
              return 'define(' . var_export(\$k, true) . ', ' . var_export(getenv(\$env), true) . ');';
            };
            \$out  = \"<?php\\n\\n\";
            \$out .= \$d('DB_HOST',    'DB_HOST')    . \"\\n\";
            \$out .= \$d('DB_NAME',    'DB_NAME')    . \"\\n\";
            \$out .= \$d('DB_USER',    'DB_USER')    . \"\\n\";
            \$out .= \$d('DB_PASS',    'DB_PASS')    . \"\\n\";
            \$out .= \"define('DB_CHARSET', 'utf8mb4');\\n\\n\";
            \$out .= \"define('APP_NAME', 'Subventionssimulator');\\n\";
            \$out .= \$d('APP_BASE_URL', 'APP_BASE_URL') . \"\\n\";
            \$out .= \"define('APP_ENV', 'production');\\n\\n\";
            \$out .= \$d('AUTH_USER',      'AUTH_USER')      . \"\\n\";
            \$out .= \$d('AUTH_PASS_HASH', 'AUTH_PASS_HASH') . \"\\n\";
            file_put_contents('config/config.php', \$out);
            echo 'config.php generiert.' . PHP_EOL;
          "

      # 4. Modus prüfen
      # Echte Deploys erst, wenn die Repo-Variable CYON_RSYNC_LIVE = true ist.
      # Bis dahin läuft jeder Deploy (auch bei Push) als Dry-Run.
      - name: Check mode
        id: mode
        env:
          LIVE:      ${{ vars.CYON_RSYNC_LIVE }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$LIVE" != "true" ] || [ "$INPUT_DRY" = "true" ]; then
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry-Run: es wird nichts übertragen oder gelöscht."
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # 5. SSH einrichten (Deploy-Key nur für dieses Repo, Host-Key gepinnt)
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.CYON_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.CYON_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # 6. Sicherstellen, dass der Key auf dem Server per rrsync auf den
      # Projektordner eingesperrt ist. Ein normaler Befehl MUSS scheitern.
      # Sonst wäre das Ziel unten das ganze Home-Verzeichnis -> Abbruch.
      - name: Verify key is restricted (rrsync)
        env:
          HOST: ${{ secrets.CYON_USER }}@${{ secrets.CYON_HOST }}
        run: |
          if ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes "$HOST" true 2>/dev/null; then
            echo "::error::Der Deploy-Key hat vollen Shell-Zugriff. In ~/.ssh/authorized_keys mit command=\"~/bin/rrsync -wo <projektordner>\",restrict einschränken. Abbruch."
            exit 1
          fi
          echo "Key ist eingeschränkt. OK."

      # 7. Deploy via rsync
      # Zielpfad ist leer: rrsync auf dem Server legt den Projektordner fest.
      # Deployed: public_html/, includes/, config/ (mit generiertem config.php), api/
      # Nicht deployed: siehe .deployignore
      - name: Deploy via rsync to cyon
        env:
          HOST: ${{ secrets.CYON_USER }}@${{ secrets.CYON_HOST }}
          DRY:  ${{ steps.mode.outputs.flag }}
        run: |
          rsync -rltz --delete --itemize-changes $DRY \
            --exclude-from=.deployignore \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes" \
            ./ "$HOST:"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_deploy

      # 8. Deploy-Status melden
      - name: Deployment summary
        if: success()
        run: |
          if [ -n "${{ steps.mode.outputs.flag }}" ]; then
            echo "### Dry-Run abgeschlossen (nichts geändert)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Deployment erfolgreich! :rocket:" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Ziel:** subventionssimulator.zurich-sailing.ch" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Gestartet von:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
