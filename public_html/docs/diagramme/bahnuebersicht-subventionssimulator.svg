<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"
     aria-label="Bahnübersicht Subventionssimulator: sechs Phasen von der Erfassung der Förderprogramme bis zur Verwendung der Beiträge">
  <title>Subventionssimulator – von der Regel bis zur Verwendung</title>

  <!-- Erzeugt mit dem Skill zsf-tools-diagramme.
       Symbole aus assets/bahn-elemente.svg, Masse aus references/STIL.md.
       Die Ziffern 1–6 entsprechen der nummerierten Liste in anleitung.php.

       Segelfachlich: Wind von Nord. Erster Kreuzschlag Kurs NW = Steuerbordbug,
       Segel nach Backbord — dafür wird das Bootssymbol gespiegelt (scale(-1,1)).
       Zweiter Schlag NW->NE = Backbordbug, Segel nach Steuerbord = Symbol
       unverändert. Luvmarke wird an Steuerbord gerundet (Rechtsdrehung). -->

  <defs>
    <symbol id="boot" overflow="visible">
      <g stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round">
        <path d="M 0,-18 C 4.5,-11 8,-3 8,4 L 7,14 L -7,14 L -8,4
                 C -8,-3 -4.5,-11 0,-18 Z"/>
        <path d="M 0,-12 C 14,-6 18,8 8,18 C 10,6 8,-4 0,-12 Z"
              fill="#ffffff" stroke-width="1.3"/>
        <circle cx="0" cy="-12" r="1.6" fill="#1f2937" stroke="none"/>
      </g>
    </symbol>
    <symbol id="marke" overflow="visible">
      <circle r="21" fill="#d97706" stroke="#ffffff" stroke-width="3"/>
    </symbol>
    <symbol id="linienboje" overflow="visible">
      <circle r="13" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5"/>
    </symbol>
    <symbol id="zone" overflow="visible">
      <circle r="64" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6"/>
    </symbol>
    <symbol id="windpfeil" overflow="visible">
      <path d="M -7,0 L 7,0 L 7,56 L 17,56 L 0,90 L -17,56 L -7,56 Z"
            fill="#2563eb" fill-opacity="0.55"/>
    </symbol>
    <symbol id="bahnpfeil" overflow="visible">
      <path d="M 0,-11 L 9,10 L 0,4 L -9,10 Z" fill="#2563eb"/>
    </symbol>
    <symbol id="rundungspfeil" overflow="visible">
      <path d="M -24,-24 A 34,34 0 0 1 24,-24"
            fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
      <path d="M 31,-17 L 20.8,-19.4 L 28.6,-27.2 Z" fill="#1f2937"/>
    </symbol>
  </defs>

  <rect width="1200" height="800" fill="#e8f1fa"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">

    <!-- Titel und Sequenzzeile -->
    <text x="48" y="58" font-size="28" font-weight="600" fill="#1f2937">Subventionssimulator – von der Regel bis zur Verwendung</text>
    <text x="48" y="90" font-size="15" font-weight="500" fill="#2563eb" letter-spacing="0.4">FÖRDERPROGRAMME – SIMULIEREN – EVENTS – FRISTEN – JAHRESBEITRÄGE – VERWENDUNG</text>

    <!-- Wind -->
    <use href="#windpfeil" x="1090" y="120"/>
    <text x="1090" y="238" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">WIND</text>

    <!-- Zuweg zur Startlinie: noch nicht auf der Bahn -->
    <path d="M 168,614 Q 300,700 468,644" fill="none" stroke="#2563eb" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="10 8"/>

    <!-- Die Bahn: Kreuz gegen den Wind, Rundung, Abfahrt zur Ziellinie -->
    <path d="M 590,630 L 395,455 L 590,240 L 760,330 L 880,480 L 880,600"
          fill="none" stroke="#2563eb" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Auslauf nach dem Ziel -->
    <path d="M 880,621 L 880,699" fill="none" stroke="#2563eb" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="10 8"/>

    <!-- Fahrtrichtung -->
    <use href="#bahnpfeil" transform="translate(492,545) rotate(-48)"/>
    <use href="#bahnpfeil" transform="translate(492,348) rotate(42)"/>
    <use href="#bahnpfeil" transform="translate(658,276) rotate(118)"/>
    <use href="#bahnpfeil" transform="translate(820,405) rotate(141)"/>
    <use href="#bahnpfeil" transform="translate(880,500) rotate(180)"/>

    <!-- Startlinie -->
    <line x1="480" y1="630" x2="700" y2="630" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
    <use href="#linienboje" x="480" y="630"/>
    <use href="#linienboje" x="700" y="630"/>
    <text x="464" y="636" font-size="14" font-weight="600" fill="#374151" text-anchor="end">START</text>

    <!-- Ziellinie -->
    <line x1="790" y1="600" x2="970" y2="600" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
    <use href="#linienboje" x="790" y="600"/>
    <use href="#linienboje" x="970" y="600"/>
    <text x="774" y="606" font-size="14" font-weight="600" fill="#374151" text-anchor="end">ZIEL</text>

    <!-- Zone und Rundungsrichtung an der Luvmarke -->
    <use href="#zone" x="590" y="230"/>
    <use href="#rundungspfeil" x="590" y="230"/>

    <!-- Boote. scale(-1,1) spiegelt das Segel nach Backbord (Steuerbordbug). -->
    <use href="#boot" fill="#2563eb" transform="translate(470,565) rotate(-48) scale(-1,1)"/>
    <use href="#boot" fill="#2563eb" transform="translate(500,340) rotate(42)"/>
    <use href="#boot" fill="#2563eb" transform="translate(718,308) rotate(118)"/>
    <use href="#boot" fill="#2563eb" transform="translate(880,545) rotate(180)"/>

    <!-- Stationen -->
    <g font-weight="700" fill="#ffffff" font-size="17" text-anchor="middle">
      <use href="#marke" x="150" y="600"/><text x="150" y="607">1</text>
      <use href="#marke" x="590" y="630"/><text x="590" y="637">2</text>
      <use href="#marke" x="395" y="455"/><text x="395" y="462">3</text>
      <use href="#marke" x="590" y="230"/><text x="590" y="237">4</text>
      <use href="#marke" x="880" y="600"/><text x="880" y="607">5</text>
      <use href="#marke" x="880" y="720"/><text x="880" y="727">6</text>
    </g>

    <!-- Beschriftung der Stationen -->
    <g font-size="17" font-weight="600" fill="#1e40af">
      <text x="190" y="588">Förderprogramme erfassen</text>
      <text x="590" y="704" text-anchor="middle">Simulieren</text>
      <text x="363" y="450" text-anchor="end">Events erfassen</text>
      <text x="590" y="136" text-anchor="middle">Fristen und Vollständigkeit</text>
      <text x="1000" y="594">Jahresbeiträge</text>
      <text x="912" y="714">Beiträge verwenden</text>
    </g>
    <g font-size="13" font-weight="400" fill="#6b7280">
      <text x="190" y="608">Die Regeln der Fördergeber</text>
      <text x="590" y="724" text-anchor="middle">Was bringt welches Programm?</text>
      <text x="363" y="470" text-anchor="end">Was hat stattgefunden</text>
      <text x="590" y="156" text-anchor="middle">Was der Antrag noch braucht</text>
      <text x="1000" y="614">Was eingegangen ist</text>
      <text x="912" y="734">Verteilung auf die Empfänger</text>
    </g>

    <!-- Hinweiskästchen -->
    <rect x="88" y="500" width="320" height="32" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
    <text x="100" y="521" font-size="13" font-weight="500" fill="#1f2937">Events kommen aus dem Class Manager Tool</text>
  </g>
</svg>
